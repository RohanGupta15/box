<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="design-system.css" />
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div id="app">
            <!-- ─── Header ─── -->
            <div class="header-container">
                <header class="header">
                    <span class="logo"><img src="icons/icon.svg" width="20" height="20" alt="" />Box</span>
                    <div class="header-actions">
                        <button
                            class="icon-btn"
                            id="import-btn"
                            title="Import notes"
                            aria-label="Import notes"
                        >
                            <svg width="16" height="16">
                                <use href="icons/sprite.svg#icon-import" />
                            </svg>
                        </button>
                        <button
                            class="icon-btn"
                            id="export-btn"
                            title="Export notes"
                            aria-label="Export notes"
                        >
                            <svg width="16" height="16">
                                <use href="icons/sprite.svg#icon-download" />
                            </svg>
                        </button>
                        <button
                            class="icon-btn"
                            id="theme-btn"
                            title="Toggle theme"
                            aria-label="Toggle theme"
                        >
                            <svg width="16" height="16">
                                <use href="icons/sprite.svg#icon-moon" />
                            </svg>
                        </button>
                        <button
                            class="icon-btn danger-btn"
                            title="Close"
                            aria-label="Close"
                        >
                            <svg width="16" height="16">
                                <use href="icons/sprite.svg#icon-close" />
                            </svg>
                        </button>
                    </div>
                </header>
                <!-- ─── Navigation ─── -->
                <nav class="nav" role="tablist">
                    <button
                        class="nav-item active"
                        role="tab"
                        id="tab-new"
                        aria-controls="panel-new"
                        data-tab="new"
                        aria-label="New Note"
                        aria-selected="true"
                    >
                        <svg width="18" height="18">
                            <use href="icons/sprite.svg#icon-reading" />
                        </svg>
                    </button>
                    <button
                        class="nav-item"
                        role="tab"
                        id="tab-list"
                        aria-controls="panel-list"
                        data-tab="list"
                        aria-label="Notes"
                        aria-selected="false"
                        tabindex="-1"
                    >
                        <svg width="18" height="18">
                            <use href="icons/sprite.svg#icon-notes" />
                        </svg>
                    </button>
                </nav>
            </div>

            <!-- ─── Main Content ─── -->
            <main class="content">
                <!-- Panel: List of Notes -->
                <div id="panel-list" class="tab-panel" role="tabpanel" aria-labelledby="tab-list">
                    <h2 class="section-title">Notes</h2>
                    <input
                        type="search"
                        class="note-title-input search-input"
                        id="searchInput"
                        placeholder="Search notes"
                        aria-label="Search notes"
                    />
                    <div class="note-list" id="noteList"></div>
                </div>

                <!-- Panel: New Note Form -->
                <div id="panel-new" class="tab-panel active" role="tabpanel" aria-labelledby="tab-new">
                    <h2 class="section-title" id="composerTitle">New Note</h2>
                    <div class="note-composer">
                        <input
                            type="text"
                            class="note-title-input"
                            id="titleInput"
                            placeholder="Note title"
                            autofocus
                        />
                        <div class="editor-wrapper">
                            <div class="editor-toolbar" id="toolbar" role="toolbar" aria-label="Formatting" aria-controls="bodyEditor">
                                <button class="tb-btn" data-cmd="bold" title="Bold" aria-pressed="false">
                                    <svg width="16" height="16"><use href="icons/sprite.svg#icon-bold"/></svg>
                                </button>
                                <button class="tb-btn" data-cmd="italic" title="Italic" aria-pressed="false" tabindex="-1">
                                    <svg width="16" height="16"><use href="icons/sprite.svg#icon-italic"/></svg>
                                </button>
                                <button class="tb-btn" data-cmd="underline" title="Underline" aria-pressed="false" tabindex="-1">
                                    <svg width="16" height="16"><use href="icons/sprite.svg#icon-underline"/></svg>
                                </button>
                                <span class="tb-divider"></span>
                                <button class="tb-btn" data-cmd="insertUnorderedList" title="Bullet list" aria-pressed="false" tabindex="-1">
                                    <svg width="16" height="16"><use href="icons/sprite.svg#icon-list-bullet"/></svg>
                                </button>
                                <button class="tb-btn" data-cmd="insertOrderedList" title="Numbered list" aria-pressed="false" tabindex="-1">
                                    <svg width="16" height="16"><use href="icons/sprite.svg#icon-list-numbered"/></svg>
                                </button>
                                <span class="tb-divider"></span>
                                <button class="tb-btn" data-cmd="removeFormat" title="Remove formatting" tabindex="-1">
                                    <svg width="16" height="16"><use href="icons/sprite.svg#icon-remove-format"/></svg>
                                </button>
                            </div>
                            <div
                                class="editor-body"
                                id="bodyEditor"
                                contenteditable="true"
                                data-placeholder="Write a draft note..."
                            ></div>
                        </div>
                        <div class="composer-actions">
                            <button class="btn-primary" id="saveBtn">
                                <svg width="16" height="16"><use href="icons/sprite.svg#icon-upload"/></svg>
                                <span id="saveLabel">Save Note</span>
                            </button>
                        </div>
                    </div>
                </div>
            </main>
            <div id="toast" class="notification" role="status" aria-live="polite"></div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
